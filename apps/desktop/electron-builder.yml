appId: com.scalmint.pos.desktop
productName: ScalPOS
asar: false
directories:
  output: release
  buildResources: electron-build
files:
  - "**/*"
  - "!release/**"
  - "!.next/cache/**"
  - "!npm-debug.log*"
win:
  target:
    - nsis
  arch:
    - x64
  artifactName: "ScalPOS-win-${arch}.${ext}"
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
